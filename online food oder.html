
<!DOCTYPE html>
<html>
<head>
    <title>Food Website</title>

    <style>
        body {
            background-color: #fff3e0;
            text-align: center;
            font-family: Arial;
            margin: 0;
        }

        header, footer {
            background-color: orangered;
            color: white;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        .home {
            background-color: orange;
            padding: 30px;
            color: white;
        }

        .card {
            background-color: white;
            padding: 15px;
            margin: 15px;
            display: inline-block;
            width: 200px;
            border-radius: 10px;
        }

        .card img {
            width: 100%;
            height: 150px;
            border-radius: 10px;
        }

        button {
            background-color: red;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }

        footer {
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .card {
                width: 80%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>My Food Website</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#food">Food</a>
    </nav>
</header>

<div class="home" id="home">
    <h2>Welcome to Our Food Website</h2>
    <p>Enjoy Tasty Food!</p>
    <button onclick="alert('Welcome!')">Order Now</button>
</div>

<h2 id="food">Our Food Items</h2>

<div class="card">
    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400">

    <h3>Pizza</h3>
    <p>Rs.150</p>

    <button onclick="alert('Pizza Ordered Successfully!')">
        Order
    </button>
</div>

<div class="card">
    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400">

    <h3>Burger</h3>
    <p>Rs.100</p>

    <button onclick="alert('Burger Ordered Successfully!')">
        Order
    </button>
</div>

<footer>
    <p>Copyright 2026</p>
</footer>

</body>
</html>
